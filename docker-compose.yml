services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tictactoe
      POSTGRES_PASSWORD: tictactoe
      POSTGRES_DB: tictactoe
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U tictactoe -d tictactoe"]
      interval: 2s
      timeout: 3s
      retries: 15
  migrate:
    image: migrate/migrate
    volumes:
      - ./internal/datasource/migrations:/migrations
    command: 
      - "-path=/migrations"
      - "-database=postgres://tictactoe:tictactoe@db:5432/tictactoe?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    environment:
      DATABASE_URL: postgres://tictactoe:tictactoe@db:5432/tictactoe
    ports: 
      - "8080:8080"
    depends_on:
      migrate: 
        condition: service_completed_successfully
      
volumes:
  pgdata: